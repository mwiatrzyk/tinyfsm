[project]
name = "tinyfsm"
version = "0.1.0"
description = "A tiny and minimal finite state machine toolkit for Python."
authors = [
    {name = "Maciej Wiatrzyk",email = "maciej.wiatrzyk@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
]

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "mockify>=0.14.0",
    "pytest>=8.4.2",
    "pytest-coverage>=0.0",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modelity"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"
